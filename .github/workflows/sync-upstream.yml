name: Sync Upstream

on:
  schedule:
    # Runs every day at 01:00 UTC (adjust cron to your preference, 09:00 AM EDT)
    - cron: '0 1 * * *'
  # Allows you to trigger the sync manually from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} --branch master