name: Sync Upstream

on:
  schedule:
    # Runs every day at 04:00 UTC (adjust cron to your preference)
    - cron: '0 4 * * *'
  # Allows you to trigger the sync manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} --branch master